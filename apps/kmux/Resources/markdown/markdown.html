<!doctype html>
<!-- The page a markdown pane shows. kmux serves it, the libraries beside it
     (fetched at build time, see scripts/build-kmux.sh) and the document's own
     files over kmux-md://, and calls kmuxRender(text, base) on every change. -->
<html>
<head>
<meta charset="utf-8">
<base id="base" href="kmux-md://app/">
<style>
  :root { color-scheme: light dark; --text: #1f2328; --dim: #59636e; --line: #d1d9e0; --code: #f6f8fa; --link: #0969da; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e6edf3; --dim: #9198a1; --line: #3d444d; --code: #151b23; --link: #4493f8; --bg: #0d1117; }
  }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #page { max-width: 820px; margin: 0 auto; padding: 24px 32px 64px; overflow-wrap: break-word; }
  h1, h2 { border-bottom: 1px solid var(--line); padding-bottom: .3em; }
  h1 { font-size: 1.9em; margin: .2em 0 .7em; } h2 { font-size: 1.45em; margin: 1.5em 0 .6em; }
  h3 { font-size: 1.2em; margin: 1.3em 0 .5em; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  code { font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: .15em .4em; border-radius: 5px; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow: auto; line-height: 1.45; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 0; padding: 0 1em; color: var(--dim); border-left: .25em solid var(--line); }
  table { border-collapse: collapse; display: block; overflow: auto; margin: 1em 0; }
  th, td { border: 1px solid var(--line); padding: 6px 13px; } th { font-weight: 600; }
  img { max-width: 100%; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
  .mermaid { text-align: center; margin: 1em 0; }
  .mermaid-error { color: #d1242f; white-space: pre-wrap; font: .85em ui-monospace, Menlo, monospace; text-align: left; }
</style>
<script src="kmux-md://app/markdown-it.min.js"></script>
<script src="kmux-md://app/purify.min.js"></script>
<script src="kmux-md://app/mermaid.min.js"></script>
</head>
<body>
<article id="page"></article>
<script>
const markdown = window.markdownit({ html: true, linkify: true, typographer: false });
const dark = matchMedia('(prefers-color-scheme: dark)');
const page = document.getElementById('page');
let source = '';

function setupMermaid() {
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark.matches ? 'dark' : 'default' });
}
setupMermaid();

// Renders `text` (the document) with relative links and images resolved
// against `base` (the document's folder), keeping the scroll position.
window.kmuxRender = async (text, base) => {
  source = text;
  if (base) document.getElementById('base').href = base;
  const y = window.scrollY;
  page.innerHTML = DOMPurify.sanitize(markdown.render(text));
  const blocks = [...page.querySelectorAll('pre > code.language-mermaid')].map(code => {
    const box = document.createElement('div');
    box.className = 'mermaid';
    box.textContent = code.textContent;
    code.parentElement.replaceWith(box);
    return box;
  });
  for (const box of blocks) {
    try {
      const { svg } = await mermaid.render('m' + Math.random().toString(36).slice(2), box.textContent);
      box.innerHTML = svg;
    } catch (error) {
      box.className = 'mermaid-error';
      box.textContent = 'Diagram error: ' + (error.message || error);
    }
  }
  window.scrollTo(0, y);
  return true;
};

// Links: anchors scroll here; everything else is kmux's call (another
// markdown file opens in this pane, web links in the browser).
document.addEventListener('click', event => {
  const link = event.target.closest('a[href]');
  if (!link) return;
  const href = link.getAttribute('href');
  if (href.startsWith('#')) return;
  event.preventDefault();
  window.webkit.messageHandlers.kmux.postMessage({ link: href, resolved: link.href });
});

dark.addEventListener('change', () => { setupMermaid(); window.kmuxRender(source); });
</script>
</body>
</html>
